  /marble-sync:
    post:
      tags:
        - Administration
      summary: Sync original images to Marble destination bucket
      description: >
        Copies original image assets (from images.orig_url) for the provided image_ids
        to the destination S3 bucket in another AWS account. Requires Administrator role.
      operationId: marbleSync
      parameters:
        - name: dry-run
          in: query
          schema:
            type: boolean
          description: When true, returns copy plan/results without writing to destination S3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items:
                    oneOf:
                      - type: integer
                      - type: string
                - type: object
                  properties:
                    image_ids:
                      type: array
                      items:
                        oneOf:
                          - type: integer
                          - type: string
                  required:
                    - image_ids
      responses:
        '200':
          description: Sync results by image ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  destination_bucket:
                    type: string
                  destination_prefix:
                    type: string
                  dry_run:
                    type: boolean
                  total_requested:
                    type: integer
                  copied:
                    type: integer
                  failed:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        image_id:
                          type: string
                        status:
                          type: string
                          enum: [copied, failed, dry-run]
                        source_key:
                          type: string
                        destination_key:
                          type: string
                        error:
                          type: string
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions - Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: []

  /marble-get:
    get:
      tags:
        - Administration
      summary: List objects in Marble destination bucket
      description: >
        Retrieves a list of all objects in the destination S3 bucket (marble-image/BIL prefix)
        with their metadata (size, last modified). Requires Administrator role.
      operationId: marbleGet
      responses:
        '200':
          description: List of objects in the destination bucket
          content:
            application/json:
              schema:
                type: object
                properties:
                  destination_bucket:
                    type: string
                  destination_prefix:
                    type: string
                  total_objects:
                    type: integer
                  objects:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        size:
                          type: integer
                          description: Size in bytes
                        last_modified:
                          type: string
                          format: date-time
                          description: ISO 8601 timestamp
                        download_url:
                          type: string
                          format: uri
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions - Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: []
