  /parallel-passages:
    get:
      tags:
        - Reference
      summary: Find parallel scripture passages
      description: Find passage groups overlapping the requested scripture range and return all scriptures in each matching group.
      operationId: getParallelPassages
      parameters:
        - name: scripture
          in: query
          required: true
          description: JSON object containing numeric start_idx and end_idx, with start_idx less than or equal to end_idx.
          content:
            application/json:
              schema:
                type: object
                properties:
                  start_idx:
                    type: number
                  end_idx:
                    type: number
                required: [start_idx, end_idx]
              example:
                start_idx: 42012022
                end_idx: 42012023
      responses:
        '200':
          description: Matching passage groups, or an object with an empty scriptures array when no groups match.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        passage_id:
                          type: integer
                        scriptures:
                          type: array
                          items:
                            type: string
                      required: [passage_id, scriptures]
                  - type: object
                    properties:
                      scriptures:
                        type: array
                        maxItems: 0
                        items:
                          type: string
                    required: [scriptures]
        '400':
          description: Missing scripture parameter, malformed JSON, or invalid range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to query parallel passages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []

