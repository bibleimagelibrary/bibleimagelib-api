openapi: 3.0.0
info:
  title: Bible Image Library API
  description: The Bible image library API provides access to a curated collection of images related to the Bible.
    High speed search capabilities allow users to find images by keywords, styles, scriptures, and collections.
    
    The API supports role-based access control for CRUD operations on images and collections.
    
    It also includes administrative endpoints for managing users and roles.

    Images now identify composition_renders joined to shared compositions metadata.
    
  version: 1.1.0
  contact:
    name: Bible Image Library
servers:
  - url: https://q9md038uhk.execute-api.us-east-1.amazonaws.com
    description: Production API
  - url: http://localhost:3000
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito JWT token

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ImageResponse:
      type: object
      properties:
        render_created_at:
          type: string
          format: date-time
          nullable: true
        render_updated_at:
          type: string
          format: date-time
          nullable: true
        render_updated_by:
          type: string
          nullable: true
        render_updated_by_email:
          type: string
          format: email
          nullable: true
        version:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        resolution:
          type: string
          nullable: true
        mime_type:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        historical_context:
          type: string
          nullable: true
        render_authors:
          type: string
          nullable: true
        render_copyright:
          type: string
          nullable: true
        render_copyright_license:
          type: string
          nullable: true
        render_copyright_attribution:
          type: string
          nullable: true
        copyright_license:
          type: string
          nullable: true
        copyright_attribution:
          type: string
          nullable: true
        composition_id:
          type: integer
        composition_uuid:
          type: string
          format: uuid
        id:
          type: integer
        uuid:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        keywords:
          type: array
          items:
            type: string
        styles:
          type: array
          items:
            type: string
        s3key:
          type: string
          nullable: true
        orig_url:
          type: string
          nullable: true
        thumb_url_small:
          type: string
          nullable: true
        thumb_url_large:
          type: string
          nullable: true
        avg_luminance:
          type: number
          format: double
          nullable: true
        sort_order:
          type: integer
          nullable: true
        submitted_by:
          type: string
          nullable: true
        submitted_by_email:
          type: string
          format: email
          nullable: true
        is_published:
          type: boolean
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          nullable: true
        updated_by_email:
          type: string
          format: email
          nullable: true
        external_id:
          type: string
          nullable: true
        default_language_code:
          type: string
          nullable: true
        original_file_name:
          type: string
          nullable: true
        authors:
          type: string
          nullable: true
        copyright:
          type: string
          nullable: true
        is_featured:
          type: boolean
        scriptures:
          type: array
          items:
            type: string
          nullable: true
        thematic_links:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id:
                type: integer
              thematic_link:
                type: string
        definitions:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id:
                type: integer
              language_code:
                type: string
              title:
                type: string
                nullable: true
              subject:
                type: string
                nullable: true
              description:
                type: string
                nullable: true
              tags:
                type: array
                items:
                  type: string
                nullable: true

    CreateImageResponse:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        composition_id:
          type: integer
        composition_uuid:
          type: string
          format: uuid
        sort_order:
          type: integer
      required: [id, uuid, composition_id, composition_uuid, sort_order]

    UpdateImageResponse:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        composition_id:
          type: integer
        composition_uuid:
          type: string
          format: uuid
      required: [id, uuid, composition_id, composition_uuid]

    DeleteImageResponse:
      type: object
      properties:
        id:
          description: Render ID echoed from the request.
          oneOf:
            - type: integer
            - type: string
      required: [id]

    CollectionRenderMembershipResponse:
      type: object
      properties:
        collection_id:
          type: string
          description: PostgreSQL bigint ID serialized as a string.
        render_id:
          type: string
          description: PostgreSQL bigint ID serialized as a string.
        sort_order:
          type: integer
        created_by:
          type: string
          nullable: true
        created_by_email:
          type: string
          format: email
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [collection_id, render_id, sort_order, created_by, created_by_email, created_at]

    AddImagesToCollectionResponse:
      type: object
      properties:
        collection_id:
          type: string
          description: PostgreSQL bigint ID serialized as a string.
        images_added:
          type: integer
          description: Number of processed membership entries, including existing entries whose sort order was updated.
        images:
          type: array
          items:
            $ref: '#/components/schemas/CollectionRenderMembershipResponse'
      required: [collection_id, images_added, images]

    RemoveImagesFromCollectionResponse:
      type: object
      properties:
        collection_id:
          type: string
          description: PostgreSQL bigint ID serialized as a string.
        images_removed:
          type: integer
      required: [collection_id, images_removed]

    DeleteCollectionResponse:
      type: object
      properties:
        message:
          type: string
        id:
          description: Collection ID or UUID echoed from the request.
          oneOf:
            - type: integer
            - type: string
      required: [message, id]

    CollectionImageResponse:
      type: object
      properties:
        composition_id:
          type: integer
        composition_uuid:
          type: string
          format: uuid
        id:
          type: integer
        uuid:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          nullable: true
        keywords:
          type: array
          items:
            type: string
        styles:
          type: array
          items:
            type: string
        s3key:
          type: string
          nullable: true
        orig_url:
          type: string
          nullable: true
        thumb_url_small:
          type: string
          nullable: true
        thumb_url_large:
          type: string
          nullable: true
        avg_luminance:
          type: number
          format: double
          nullable: true
        sort_order:
          type: integer
          nullable: true
        collection_sort_order:
          type: integer
          nullable: true
        added_by:
          type: string
          nullable: true
        added_by_email:
          type: string
          format: email
          nullable: true
        added_at:
          type: string
          format: date-time
          nullable: true

    CollectionResponse:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        is_public:
          type: boolean
        is_featured:
          type: boolean
        cover_image_id:
          type: integer
          nullable: true
        cover_image_url:
          type: string
          nullable: true
        cover_image_luminance:
          type: number
          format: double
          nullable: true
        created_by:
          type: string
        created_by_email:
          type: string
        updated_by:
          type: string
          nullable: true
        updated_by_email:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        image_count:
          type: integer
        images:
          type: array
          items:
            $ref: '#/components/schemas/CollectionImageResponse'

    ImagePassageRequest:
      type: object
      properties:
        book_id:
          type: integer
          minimum: 1
        start_chapter:
          type: integer
          minimum: 0
        start_verse:
          type: integer
          minimum: 0
          nullable: true
        end_chapter:
          type: integer
          minimum: 0
          nullable: true
        end_verse:
          type: integer
          minimum: 0
          nullable: true
        passage_type:
          type: string
          enum: [main, secondary]
          default: main
      required: [book_id, start_chapter]

    ImageDefinitionRequest:
      type: object
      properties:
        language_code:
          type: string
          minLength: 1
        title:
          type: string
          nullable: true
        subject:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        tags:
          type: array
          nullable: true
          items:
            type: string
      required: [language_code]

    CreateImageRequest:
      type: object
      description: >-
        Create a render. composition_id=0 creates a composition (title required);
        a positive ID attaches to an existing composition. Provide exactly one of
        fileBase64 or source_s3_key, plus contentType and extension.
      properties:
        collections:
          type: array
          description: Collections to add the new render to, subject to collection permissions.
          items:
            oneOf:
              - type: integer
              - type: string
                format: uuid
        type:
          type: string
          nullable: true
        historical_context:
          type: string
          nullable: true
        copyright_license:
          type: string
          nullable: true
        copyright_attribution:
          type: string
          nullable: true
        external_ids:
          type: object
          description: >-
            Authority codes mapped to an external ID string or an object whose
            keys are external IDs. Nested object values are ignored.
          additionalProperties:
            oneOf:
              - type: string
                minLength: 1
              - type: object
                additionalProperties: {}
          example:
            example-authority: external-123
        version:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        resolution:
          type: string
          nullable: true
        mime_type:
          type: string
          nullable: true
        render_authors:
          type: string
          nullable: true
        render_copyright:
          type: string
          nullable: true
        render_copyright_license:
          type: string
          nullable: true
        render_copyright_attribution:
          type: string
          nullable: true
        composition_mutation_mode:
          type: string
          description: Create defaults to create for composition_id=0, otherwise none. Update defaults to none; append/replace mutate shared composition metadata.
          enum: [create, none, append, replace]
        composition_id:
          type: integer
          minimum: 0
          description: Required for creation; 0 creates a new composition.
        source_s3_key:
          type: string
          description: Alternative to fileBase64; key of an existing upload.
        source_s3_bucket:
          type: string
          description: Optional source bucket; defaults to configured upload/original bucket.
        title:
          type: string
          description: Image title
        description:
          type: string
        keywords:
          type: array
          items:
            type: string
        styles:
          type: array
          items:
            type: string
        passages:
          type: array
          description: Composition passages; takes precedence over scripture when both are supplied.
          items:
            $ref: '#/components/schemas/ImagePassageRequest'
        scripture:
          type: array
          description: Alternative to passages, used when passages is absent.
          items:
            $ref: '#/components/schemas/ImagePassageRequest'
        contentType:
          type: string
          enum: ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'application/pdf']
        extension:
          type: string
        fileBase64:
          type: string
          description: Base64-encoded file content
        sort_order:
          type: integer
        is_featured:
          type: boolean
        external_id:
          type: string
        default_language_code:
          type: string
        original_file_name:
          type: string
        authors:
          type: string
          nullable: true
        copyright:
          type: string
        thematic_links:
          type: array
          items:
            type: string
        definitions:
          type: array
          items:
            $ref: '#/components/schemas/ImageDefinitionRequest'
      required:
        - composition_id
        - contentType
        - extension
      allOf:
        # Exactly one non-empty file source is required.
        - oneOf:
            - required: [fileBase64]
              properties:
                fileBase64:
                  type: string
                  minLength: 1
            - required: [source_s3_key]
              properties:
                source_s3_key:
                  type: string
                  pattern: '[^\s/]'
        # OpenAPI 3.0 expresses this condition with oneOf rather than if/then.
        - oneOf:
            - properties:
                composition_id:
                  enum: [0]
                title:
                  type: string
                  pattern: '\S'
              required: [title]
            - properties:
                composition_id:
                  type: integer
                  minimum: 1

    UpdateImageRequest:
      type: object
      description: Updates a render. Shared composition metadata is unchanged unless append or replace is selected.
      properties:
        id:
          type: integer
          minimum: 1
          description: Alternative render ID when updateId is absent.
        render_id:
          type: integer
          minimum: 1
          description: Alternative render ID when updateId and id are absent.
        is_published:
          type: boolean
        source_s3_key:
          type: string
          description: Existing upload key to use instead of fileBase64 when replacing the file.
        source_s3_bucket:
          type: string
          description: Optional source bucket; defaults to configured upload/original bucket.
        type:
          type: string
          nullable: true
        historical_context:
          type: string
          nullable: true
        copyright_license:
          type: string
          nullable: true
        copyright_attribution:
          type: string
          nullable: true
        external_ids:
          type: object
          description: >-
            Authority codes mapped to an external ID string or an object whose
            keys are external IDs. Nested object values are ignored.
          additionalProperties:
            oneOf:
              - type: string
                minLength: 1
              - type: object
                additionalProperties: {}
          example:
            example-authority: external-123
        version:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        resolution:
          type: string
          nullable: true
        mime_type:
          type: string
          nullable: true
        render_authors:
          type: string
          nullable: true
        render_copyright:
          type: string
          nullable: true
        render_copyright_license:
          type: string
          nullable: true
        render_copyright_attribution:
          type: string
          nullable: true
        composition_mutation_mode:
          type: string
          enum: [none, append, replace]
          default: none
        updateId:
          type: integer
          description: Image ID to update
        title:
          type: string
        description:
          type: string
        keywords:
          type: array
          items:
            type: string
        styles:
          type: array
          items:
            type: string
        passages:
          type: array
          description: Composition passages; takes precedence over scripture when both are supplied.
          items:
            $ref: '#/components/schemas/ImagePassageRequest'
        scripture:
          type: array
          description: Alternative to passages, used when passages is absent.
          items:
            $ref: '#/components/schemas/ImagePassageRequest'
        contentType:
          type: string
          enum: ['', 'image/jpeg', 'image/png', 'image/gif', 'image/webp', 'application/pdf']
          description: Only include if updating the image file
        extension:
          type: string
        fileBase64:
          type: string
          description: Base64-encoded file content. Only include if updating image file.
        sort_order:
          type: integer
        is_featured:
          type: boolean
        external_id:
          type: string
        default_language_code:
          type: string
        original_file_name:
          type: string
        authors:
          type: string
          nullable: true
        copyright:
          type: string
        thematic_links:
          type: array
          items:
            type: string
        definitions:
          type: array
          items:
            $ref: '#/components/schemas/ImageDefinitionRequest'
      anyOf:
        - required: [updateId]
        - required: [id]
        - required: [render_id]

    DeleteImageRequest:
      type: object
      properties:
        id:
          type: integer
          description: Render ID to delete
      required:
        - id

    CreateCollectionRequest:
      type: object
      properties:
        name:
          type: string
          description: Collection name
        description:
          type: string
        is_public:
          type: boolean
        cover_image_id:
          type: integer
      required:
        - name

    UpdateCollectionRequest:
      type: object
      properties:
        id:
          type: integer
          description: Collection ID to update
        name:
          type: string
        description:
          type: string
        is_public:
          type: boolean
        is_featured:
          type: boolean
        cover_image_id:
          type: integer
      required:
        - id

    DeleteCollectionRequest:
      type: object
      properties:
        id:
          type: integer
          description: Collection ID to delete
      required:
        - id

    AddImagesToCollectionRequest:
      type: object
      properties:
        collection_id:
          type: string
          description: Collection numeric ID or UUID.
        images:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              render_id:
                type: integer
                description: Render ID; image_id is accepted as a compatibility alias.
              image_id:
                type: integer
              sort_order:
                type: integer
            anyOf:
              - required: [render_id]
              - required: [image_id]
      required: [collection_id, images]

    RemoveImagesFromCollectionRequest:
      type: object
      properties:
        collection_id:
          type: string
          description: Collection numeric ID or UUID.
        render_ids:
          type: array
          minItems: 1
          items:
            type: integer
        image_ids:
          type: array
          description: Compatibility alias for render_ids.
          minItems: 1
          items:
            type: integer
      required: [collection_id]
      anyOf:
        - required: [render_ids]
        - required: [image_ids]

    SearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              composition_id:
                type: integer
              composition_uuid:
                type: string
                format: uuid
              render_created_at:
                type: string
                format: date-time
                nullable: true
              render_updated_at:
                type: string
                format: date-time
                nullable: true
              render_updated_by:
                type: string
                nullable: true
              render_updated_by_email:
                type: string
                format: email
                nullable: true
              version:
                type: string
                nullable: true
              format:
                type: string
                nullable: true
              resolution:
                type: string
                nullable: true
              mime_type:
                type: string
                nullable: true
              type:
                type: string
                nullable: true
              historical_context:
                type: string
                nullable: true
              render_authors:
                type: string
                nullable: true
              render_copyright:
                type: string
                nullable: true
              render_copyright_license:
                type: string
                nullable: true
              render_copyright_attribution:
                type: string
                nullable: true
              copyright_license:
                type: string
                nullable: true
              copyright_attribution:
                type: string
                nullable: true
              id:
                type: integer
              uuid:
                type: string
                format: uuid
              title:
                type: string
              keywords:
                type: array
                items:
                  type: string
              styles:
                type: array
                items:
                  type: string
              orig_url:
                type: string
              thumb_url_small:
                type: string
              thumb_url_large:
                type: string
              avg_luminance:
                type: number
                format: double
                nullable: true
              s3key:
                type: string
              sort_order:
                type: integer
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
              submitted_by:
                type: string
              submitted_by_email:
                type: string
                format: email
              is_published:
                type: boolean
              is_featured:
                type: boolean
              updated_by:
                type: string
                nullable: true
              updated_by_email:
                type: string
                format: email
                nullable: true
              description:
                type: string
                nullable: true
              external_id:
                type: string
                nullable: true
              default_language_code:
                type: string
                nullable: true
              original_file_name:
                type: string
                nullable: true
              authors:
                type: string
                nullable: true
              copyright:
                type: string
                nullable: true
              scriptures:
                type: array
                items:
                  type: string
        pageInfo:
          type: object
          properties:
            page:
              type: integer
            hasNextPage:
              type: boolean
            totalMatches:
              type: integer
            totalCompositions:
              type: integer
              description: Number of distinct matching compositions.
            totalPages:
              type: integer

    BibleBook:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          description: 3-letter book code (e.g., 'GEN', 'MAT', 'LUK')
        name:
          type: string
        book_order:
          type: string
          description: Textual book order that can be sorted alphanumerically, with 'A' prefix for Old Testament and 'B' prefix for New Testament (e.g., 'A01', 'B01')

    KeywordResponse:
      type: object
      properties:
        keyword:
          type: string
        count:
          type: integer

    StyleResponse:
      type: object
      properties:
        style:
          type: string
        count:
          type: integer

    UserResponse:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        groups:
          type: array
          items:
            type: string

    RoleResponse:
      type: object
      properties:
        groupName:
          type: string
        description:
          type: string
        userCount:
          type: integer

security:
  - BearerAuth: []

paths:
  /images:
    get:
      summary: Report a missing image ID
      operationId: getImageMissingId
      description: Does not list images. Returns 400 when no image ID is supplied.
      responses:
        '400':
          description: Missing image ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Missing image ID
      security: []

  /images/create:
    post:
      tags:
        - Images
      summary: Create a new image
      description: Upload a new image with metadata. Requires Contributor role or higher.
      operationId: createImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImageRequest'
      responses:
        '201':
          description: Image created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateImageResponse'
        '400':
          description: Bad request - missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: []

  /images/update:
    post:
      tags:
        - Images
      summary: Update an image
      description: Update image metadata or file. Only submitter or administrator can update.
      operationId: updateImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateImageRequest'
      responses:
